services:
  db:
    image: postgres:17-alpine
    container_name: voacraque-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${VOACRAQUE_DB_USER:-voacraque}
      POSTGRES_PASSWORD: ${VOACRAQUE_DB_PASSWORD:-voacraque}
      POSTGRES_DB: ${VOACRAQUE_DB_NAME:-voacraque}
    ports:
      - "${VOACRAQUE_DB_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VOACRAQUE_DB_USER:-voacraque} -d ${VOACRAQUE_DB_NAME:-voacraque}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: voacraque-app-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${VOACRAQUE_DB_USER:-voacraque}:${VOACRAQUE_DB_PASSWORD:-voacraque}@db:5432/${VOACRAQUE_DB_NAME:-voacraque}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-troque-em-producao-0000000000}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-super@voacraque.app}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-VoaCraque123!}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Superadmin}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      NODE_ENV: development
      # Bind mounts no Windows/Docker Desktop nem sempre disparam inotify;
      # polling garante que o hot-reload funcione de qualquer jeito.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${VOACRAQUE_APP_PORT:-3000}:3000"
    volumes:
      # Codigo fonte montado do host: alteracoes aparecem em tempo real.
      - .:/app
      # Volumes anonimos: preservam o que foi instalado/gerado DENTRO da
      # imagem (Linux) em vez de deixar o bind mount acima sobrescrever com
      # o que existe no host (Windows), o que quebraria node_modules nativos
      # e os binarios do Prisma.
      - /app/node_modules
      - /app/.next
      - /app/src/generated
    # --webpack: o watcher nativo do Turbopack (baseado em inotify) nao
    # enxerga mudancas feitas pelo host em bind mounts do Docker Desktop no
    # Windows. O webpack + polling (via WATCHPACK_POLLING acima) e o
    # combo que funciona de forma confiavel nesse cenario.
    command: sh -c "npx prisma migrate deploy && npx next dev --webpack -H 0.0.0.0 -p 3000"

volumes:
  pgdata_dev:
