name: CI

on:
  # A main tem ruleset (PR obrigatorio, sem push direto): todo codigo chega nela por
  # pull request, entao a suite roda nas PRs que miram a main.
  pull_request:
    branches: [main]
    # PR que so mexe em documentacao nao precisa da suite. Se tocar em qualquer outro
    # arquivo, o CI roda normalmente. Se o ruleset da main passar a exigir status
    # checks, remova este filtro: um workflow pulado deixa o check pendente.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
  # Em push na main (merge da PR) quem roda a suite e o deploy.yml (workflow_call),
  # para nao executar tudo duas vezes; o deploy so segue se todos os jobs passarem.
  # O ruleset nao exige status checks, entao esse gate e a garantia de que um merge
  # com CI vermelho nao vai para producao.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Novo push na PR cancela a execucao antiga. Na main (via deploy.yml) nunca cancela:
  # dois merges seguidos nao podem derrubar a suite de um deploy em andamento.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # prisma.config.ts exige DATABASE_URL so pra carregar (o generate nao acessa banco).
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # As regras com tipos (no-floating-promises etc.) leem o client gerado do Prisma.
      - run: npm run db:generate
      - run: npm run lint

  static:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # prisma.config.ts exige DATABASE_URL so pra carregar (o generate nao acessa banco).
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck

  jest:
    name: Testes Jest (unitarios, componente e integracao)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voacraque
          POSTGRES_PASSWORD: voacraque
          POSTGRES_DB: voacraque_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voacraque -d voacraque_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Sobrescreve a porta do .env.test (db-test local) pelo service container.
      DATABASE_URL: "postgresql://voacraque:voacraque@localhost:5432/voacraque_test?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Segredo efemero: nunca o AUTH_SECRET de producao.
      - name: Gera AUTH_SECRET efemero
        run: echo "AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:generate
      - name: Jest (unit + component + integration) com cobertura
        run: npm run test:ci
      - name: Resumo de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  cypress-component:
    name: Testes de componente (Cypress)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Cypress Component Testing
        uses: cypress-io/github-action@v7
        with:
          install: false
          component: true
          browser: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-component-evidencias
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

  cypress-e2e:
    name: Testes E2E (Cypress na imagem do deploy)
    # E o job mais caro (builda a imagem Docker e sobe a stack): so comeca se lint e
    # typecheck passarem, para nao gastar minutos de runner com erro que eles pegam em
    # 1-2 min. Jest e Cypress de componente seguem em paralelo, sem esperar ninguem.
    needs: [lint, static]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Visao do host (porta publicada do db do docker-compose.e2e.yml): usada pelo
      # prisma generate e pelas tasks do Cypress. Dentro do container e db:5432.
      DATABASE_URL: "postgresql://voacraque:voacraque@localhost:55434/voacraque_e2e?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Segredo efemero, o mesmo para o container e para as tasks (assinam a sessao).
      - name: Gera AUTH_SECRET efemero
        run: echo "AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:generate
      # Mesma imagem do deploy (Dockerfile da raiz), em amd64 porque o runner e amd64; o
      # deploy.yml publica a arm64 da t4g. Cache proprio para nao competir com o do deploy.
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem do app (a do deploy)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: voacraque-app:e2e
          cache-from: type=gha,scope=e2e-amd64
          cache-to: type=gha,mode=max,scope=e2e-amd64
      # O entrypoint da imagem roda migrate + seed; o healthcheck so passa com o Next no ar.
      - name: Sobe a stack (db + app)
        run: node scripts/with-env.mjs .env.e2e -- docker compose -f docker-compose.e2e.yml up -d --no-build --wait --wait-timeout 240
      - name: Cypress E2E (imagem de producao na porta 3100)
        uses: cypress-io/github-action@v7
        with:
          install: false
          browser: chrome
          spec: "cypress/e2e/**/*.cy.ts"
      - name: Log do app
        if: failure()
        run: node scripts/with-env.mjs .env.e2e -- docker compose -f docker-compose.e2e.yml logs --no-color > cypress/e2e-app.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-e2e-evidencias
          path: |
            cypress/screenshots
            cypress/videos
            cypress/e2e-app.log
          if-no-files-found: ignore
      - name: Derruba a stack
        if: always()
        run: node scripts/with-env.mjs .env.e2e -- docker compose -f docker-compose.e2e.yml down -v --remove-orphans
