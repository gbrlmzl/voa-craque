name: Deploy

on:
  push:
    branches: [main]
    # Merge que so altera documentacao nao gera imagem nem deploy.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"

permissions:
  id-token: write
  contents: read

# A main so recebe merge de PR (ruleset). Deploys nunca se cancelam: um merge novo
# espera o anterior terminar em vez de interromper o envio da imagem ou o SSM.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  ECR_REPOSITORY: voacraque
  INSTANCE_ID: i-09475c5f769bf5466

jobs:
  # Suite inteira (lint, typecheck, jest, cypress component e e2e) definida em ci.yml.
  # O deploy so sai se todos os jobs passarem.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build e publica imagem Docker (ECR)
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura credenciais AWS (OIDC, sem access key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::636227829069:role/voacraque-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem (arm64, mesma arquitetura da t4g)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na instancia (SSM)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configura credenciais AWS (OIDC, sem access key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::636227829069:role/voacraque-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy na instancia via SSM
        env:
          ECR_REGISTRY: ${{ needs.build.outputs.registry }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy voacraque ${{ github.sha }}" \
            --parameters "{\"commands\":[\"cd /opt/voacraque && git pull --ff-only && AWS_REGION=$AWS_REGION ECR_REGISTRY=$ECR_REGISTRY ECR_REPOSITORY=$ECR_REPOSITORY IMAGE_TAG=${{ github.sha }} bash scripts/remote-deploy.sh\"]}" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{StdOut:StandardOutputContent,StdErr:StandardErrorContent}" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy falhou com status $STATUS"
            exit 1
          fi
