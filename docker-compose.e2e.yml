# Stack do E2E (Cypress): a MESMA imagem do deploy (Dockerfile da raiz) + um Postgres descartavel.
# Nada aqui toca o banco de desenvolvimento, o S3 ou o SMTP: o banco e tmpfs e as chaves externas
# ficam vazias. O Cypress roda no host e fala com o app em http://localhost:3100; as tasks (cenario,
# sessao, link de redefinicao) falam com o banco em localhost:${E2E_DB_PORT}.
#
# Uso (ver docs/guia-de-testes.md):
#   npm run e2e:up      # build da imagem (se preciso), sobe db + app e espera o healthcheck
#   npm run cy:run      # ou cy:open
#   npm run e2e:down    # derruba e apaga o banco
# Os scripts carregam o .env.e2e (scripts/with-env.mjs) para as variaveis abaixo; no CI o
# AUTH_SECRET vem do job e tem precedencia.
name: voacraque-e2e

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: voacraque
      POSTGRES_PASSWORD: voacraque
      POSTGRES_DB: voacraque_e2e
    ports:
      - "${E2E_DB_PORT:-55434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voacraque -d voacraque_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    # `build` cobre o uso local (e2e:up --build); o CI constroi a imagem antes, com cache, e sobe
    # com --no-build usando esta mesma tag.
    image: ${E2E_APP_IMAGE:-voacraque-app:e2e}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://voacraque:voacraque@db:5432/voacraque_e2e?schema=public
      # O mesmo valor que as tasks do host usam para assinar a sessao (.env.e2e ou o CI).
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET (o .env.e2e ja traz um)}
      AUTH_URL: http://localhost:3100
      TRUST_PROXY_HOPS: "1"
      # O E2E semeia o proprio cenario; o seed do entrypoint so cria o superadmin e as configuracoes.
      SEED_SAMPLE_DATA: "false"
      SUPERADMIN_EMAIL: super@voacraque.test
      SUPERADMIN_PASSWORD: SenhaSuperE2E123!
      SUPERADMIN_NAME: Superadmin
      SUPERADMIN_USERNAME: super
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
      MAIL_DRIVER: console
      MAX_UPLOAD_MB: "5"
      MAX_PHOTO_UPLOAD_MB: "20"
      # Sem credencial externa: o botao do Google nem aparece e nada chega ao S3 ou ao SMTP.
      S3_BUCKET: ""
      S3_REGION: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_PUBLIC_BASE_URL: ""
      AUTH_GOOGLE_ID: ""
      AUTH_GOOGLE_SECRET: ""
      SMTP_HOST: ""
      SMTP_PORT: ""
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      NODE_ENV: production
    ports:
      - "3100:3000"
    tmpfs:
      - /app/uploads
    healthcheck:
      # A imagem node:slim nao tem curl nem wget. Qualquer resposta HTTP (200 ou o redirecionamento
      # do proxy) prova que o Next subiu; so erro de conexao reprova.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login',{redirect:'manual'}).then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 60
      # O entrypoint roda migrate + seed + purga antes do `next start`.
      start_period: 15s
