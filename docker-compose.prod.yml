services:
  db:
    ports: !reset []

  app:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: voacraque-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data

volumes:
  caddy_data:
