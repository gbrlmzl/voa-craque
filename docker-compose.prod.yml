services:
  db:
    ports: !reset []

  app:
    image: ${APP_IMAGE:-636227829069.dkr.ecr.sa-east-1.amazonaws.com/voacraque:latest}
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: voacraque-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data

volumes:
  caddy_data:
